<title>Прототип самоучителя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Rubik:wght@500;600;700&display=swap">
<style>
/* Layout: одна колонка как экран телефона. Тёмная иммерсивная сцена, крупные мягкие карточки, один яркий CTA.
   Палитра: ночной индиго фон, мятный CTA, фиолетовый акцент, солнечно-жёлтый для наград. */
:root {
  --bg: #0f1230;
  --glow1: rgba(124, 92, 255, .30);
  --glow2: rgba(46, 230, 184, .16);
  --surface: rgba(255, 255, 255, .07);
  --surface-strong: rgba(255, 255, 255, .12);
  --line: rgba(255, 255, 255, .14);
  --ink: #f4f6ff;
  --muted: #a9b0da;
  --cta: #2ee6b8;
  --cta-ink: #04281f;
  --cta-edge: #17a883;
  --violet: #7c5cff;
  --violet-edge: #5236d6;
  --sun: #ffc93c;
  --bad: #ff6b7a;
  --bad-soft: rgba(255, 107, 122, .18);
  --good-soft: rgba(46, 230, 184, .18);
  --sheet: #1a1e4a;
  --accent-ink: #2ee6b8;
  --nav-bg: rgba(24, 28, 70, .88);
  --font-display: "Rubik", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0ff; --glow1: rgba(124, 92, 255, .20); --glow2: rgba(46, 230, 184, .22);
    --surface: #ffffff; --surface-strong: #f4f5ff; --line: #dfe3f8; --ink: #17194a; --muted: #5e6499;
    --cta: #19d3a5; --cta-ink: #04281f; --cta-edge: #0ea07c; --violet: #6a49f5; --violet-edge: #4a2fcf;
    --sun: #ffb800; --bad: #e5384d; --bad-soft: #ffe3e7; --good-soft: #d6f7ee; --sheet: #ffffff; --accent-ink: #5a3df0; --nav-bg: rgba(255, 255, 255, .92); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0ff; --glow1: rgba(124, 92, 255, .20); --glow2: rgba(46, 230, 184, .22);
  --surface: #ffffff; --surface-strong: #f4f5ff; --line: #dfe3f8; --ink: #17194a; --muted: #5e6499;
  --cta: #19d3a5; --cta-ink: #04281f; --cta-edge: #0ea07c; --violet: #6a49f5; --violet-edge: #4a2fcf;
  --sun: #ffb800; --bad: #e5384d; --bad-soft: #ffe3e7; --good-soft: #d6f7ee; --sheet: #ffffff; --accent-ink: #5a3df0; --nav-bg: rgba(255, 255, 255, .92); color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; padding-inline: 16px; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; font-weight: 600;
  background: radial-gradient(520px 380px at 90% -5%, var(--glow1), transparent 70%), radial-gradient(480px 360px at -10% 30%, var(--glow2), transparent 70%), var(--bg);
  background-attachment: fixed;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
#app { max-width: 460px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-block: 18px 24px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 12px; align-items: center; }
.tag { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); font-weight: 600; }

.btn { border: 0; border-radius: 20px; padding: 17px 20px; font-family: var(--font-display); font-weight: 600; font-size: 17px; background: var(--cta); color: var(--cta-ink); box-shadow: 0 5px 0 var(--cta-edge); transition: transform .08s, box-shadow .08s, filter .15s; width: 100%; }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--cta-edge); }
.btn.violet { background: var(--violet); color: #fff; box-shadow: 0 5px 0 var(--violet-edge); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; }
.btn.danger { background: var(--bad); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
.btn[disabled] { background: var(--surface-strong); color: var(--muted); box-shadow: none; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1.5px solid var(--line); padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; }
.chip svg { width: 16px; height: 16px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 28px; padding: 18px; backdrop-filter: blur(8px); }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }

/* onboarding */
.hero-title { font-family: var(--font-display); font-size: 34px; line-height: 1.12; font-weight: 700; }
.hero-title em { font-style: normal; color: var(--cta); }
.level { display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 26px; padding: 14px; transition: transform .12s, border-color .12s; }
.level:hover { border-color: var(--cta); transform: translateY(-2px); }
.level .ic { width: 64px; height: 64px; border-radius: 20px; flex: none; display: grid; place-items: center; }
.level .ic svg { width: 40px; height: 40px; }
.level b { display: block; font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.level .muted { font-size: 14px; line-height: 1.3; display: block; margin-top: 2px; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; padding: 10px; font-weight: 700; }

/* home */
.top { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.top .sp { flex: 1; }
.hero { background: linear-gradient(135deg, #6f4cff 0%, #4a6bff 55%, #26c6da 120%); border-radius: 32px; padding: 20px; color: #fff; position: relative; overflow: hidden; border: 0; }
.hero::after { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%; right: -70px; top: -80px; background: rgba(255,255,255,.14); }
.hero .tag { color: rgba(255,255,255,.8); }
.hero h2 { font-size: 26px; margin: 4px 0 2px; }
.hero p { color: rgba(255,255,255,.88); font-size: 15px; }
.hero .ring { position: absolute; right: 18px; top: 18px; width: 84px; height: 84px; z-index: 1; }
.hero .mini { margin-top: 18px; }
.hero .mascot { position: absolute; right: 14px; top: 8px; z-index: 1; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
.meter { padding: 16px; display: flex; flex-direction: column; gap: 6px; border-radius: 26px; }
.meter .big { font-family: var(--font-display); font-size: 30px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 12px; border-radius: 99px; background: var(--surface-strong); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cta), #7be8ff); border-radius: 99px; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.bar.sun > i { background: linear-gradient(90deg, #ffb800, #ffe27a); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 10px 2px 6px; }
.section-h h2 { font-size: 20px; }
.path { display: flex; flex-direction: column; padding: 8px 0 12px; }
.node { display: flex; align-items: center; gap: 16px; background: none; border: 0; text-align: left; padding: 0; width: 100%; position: relative; padding-bottom: 22px; }
.node:last-child { padding-bottom: 0; }
.node:not(:last-child)::after { content: ""; position: absolute; left: 31px; top: 66px; bottom: -2px; width: 4px; border-radius: 2px; background: var(--line); }
.node.done:not(:last-child)::after { background: var(--cta); }
.node .circle { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 22px; background: var(--surface-strong); border: 2px solid var(--line); flex: none; position: relative; z-index: 1; }
.node.done .circle { background: var(--cta); border-color: var(--cta); color: var(--cta-ink); }
.node.done .circle svg { width: 30px; height: 30px; }
.node.current .circle { background: var(--violet); border-color: var(--violet); color: #fff; box-shadow: 0 0 0 7px rgba(124,92,255,.28), 0 6px 0 var(--violet-edge); animation: pulse 2.2s ease-in-out infinite; }
.node.locked .circle { opacity: .75; }
.node .t b { display: block; font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.node .t span { color: var(--muted); font-size: 14px; }
.node.locked .t { opacity: .7; }
.sticky { position: sticky; bottom: 0; margin-inline: -16px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 62%, transparent); margin-top: auto; }

/* lesson */
.lhead { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.lhead .bar { flex: 1; height: 16px; }
.lhead .bar > i { background: linear-gradient(90deg, var(--cta), #7be8ff); }
.x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; padding: 0; }
.x svg { width: 18px; height: 18px; }
.stage { flex: 1; display: flex; flex-direction: column; gap: 16px; }
.lbl { font-family: var(--font-display); font-weight: 600; font-size: 20px; }
.teach { padding: 0; overflow: hidden; border-radius: 32px; }
.teach .art { background: linear-gradient(145deg, #7c5cff, #3ad0c4); padding: 26px 20px; color: #fff; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; position: relative; min-height: 190px; justify-content: flex-end; }
.teach .art .pic { position: absolute; right: 16px; top: 14px; width: 112px; filter: drop-shadow(0 8px 10px rgba(0,0,0,.25)); }
.teach .art .pic svg { width: 112px; height: 88px; }
.teach .bigword { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.1; word-break: break-word; }
.teach .tx { opacity: .85; font-size: 16px; }
.teach .body { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.teach .body h3 { font-size: 24px; }
.speak { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--cta); color: var(--cta-ink); display: grid; place-items: center; box-shadow: 0 5px 0 var(--cta-edge); flex: none; padding: 0; }
.speak svg { width: 26px; height: 26px; }
.speak:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--cta-edge); }
.bigword { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1.1; }
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { background: var(--surface); border: 1.5px solid var(--line); border-bottom-width: 4px; border-radius: 22px; padding: 14px 12px; font-family: var(--font-display); font-weight: 500; font-size: 18px; text-align: center; min-height: 64px; display: grid; place-items: center; transition: transform .1s, border-color .1s, background .1s; color: var(--ink); }
.opt:hover { border-color: var(--cta); transform: translateY(-2px); }
.opt.ok { background: var(--good-soft); border-color: var(--cta); }
.opt.no { background: var(--bad-soft); border-color: var(--bad); }
.opt.sel { border-color: var(--violet); background: rgba(124,92,255,.22); }
.opt.gone { visibility: hidden; }
.opt svg { width: 88px; height: 68px; }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pairs .opt { font-size: 16px; }
.line { min-height: 68px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 12px; align-items: flex-start; }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding-top: 6px; }
.tile { background: var(--surface-strong); border: 1.5px solid var(--line); border-bottom-width: 4px; border-radius: 16px; padding: 11px 18px; font-family: var(--font-display); font-weight: 500; font-size: 20px; color: var(--ink); }
.say { align-self: flex-start; }
.bubble { background: var(--surface-strong); border: 1.5px solid var(--line); border-radius: 22px 22px 22px 6px; padding: 12px 16px; font-family: var(--font-display); font-weight: 500; font-size: 20px; max-width: 90%; }
.bubble.me { align-self: flex-end; border-radius: 22px 22px 6px 22px; background: rgba(124,92,255,.28); border-color: var(--violet); }
.bubble small { display: block; color: var(--muted); font-family: var(--font-body); font-weight: 700; font-size: 13px; margin-top: 2px; }
.blank { display: inline-block; min-width: 76px; border-bottom: 3px solid var(--cta); margin: 0 4px; text-align: center; }
.insight { background: linear-gradient(160deg, rgba(255,201,60,.22), rgba(255,201,60,.06)); border-color: rgba(255,201,60,.55); }
.insight .eq { display: grid; gap: 8px; margin: 12px 0; }
.insight .eq div { background: var(--surface-strong); border-radius: 18px; padding: 12px 16px; font-family: var(--font-display); font-weight: 500; font-size: 20px; }
.insight .eq small { display: block; color: var(--muted); font-family: var(--font-body); font-weight: 700; font-size: 13px; }
mark { background: var(--sun); color: #1a1300; padding: 0 7px; border-radius: 8px; }
details { margin-top: 8px; }
summary { cursor: pointer; font-weight: 800; color: var(--muted); }
.scene { border-radius: 28px; overflow: hidden; border: 1.5px solid var(--line); background: linear-gradient(160deg, #3b2f9e 0%, #2bb5b0 100%); position: relative; aspect-ratio: 16/10; }
.scene svg { width: 100%; height: 100%; display: block; }
.scene .cap { position: absolute; left: 12px; right: 12px; bottom: 12px; background: rgba(8,10,34,.82); color: #fff; border-radius: 16px; padding: 10px 14px; font-family: var(--font-display); font-weight: 500; }
.scene .cap small { display: block; font-family: var(--font-body); font-weight: 700; opacity: .8; }

/* feedback sheet */
.sheet { position: sticky; bottom: 0; margin-inline: -16px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); border-radius: 28px 28px 0 0; background: var(--sheet); border-top: 2px solid var(--line); display: flex; flex-direction: column; gap: 12px; margin-top: auto; animation: rise .25s ease-out; }
.sheet.ok { border-top-color: var(--cta); background: linear-gradient(var(--good-soft), var(--good-soft)), var(--sheet); }
.sheet.no { border-top-color: var(--bad); background: linear-gradient(var(--bad-soft), var(--bad-soft)), var(--sheet); }
.sheet .msg { display: flex; align-items: center; gap: 12px; }
.sheet .msg b { font-family: var(--font-display); font-size: 20px; font-weight: 600; display: block; }
.sheet .msg span { color: var(--muted); font-weight: 700; }
.foot { margin-top: auto; padding-top: 14px; }

/* done */
.burst { text-align: center; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { text-align: center; padding: 14px 6px; border-radius: 24px; }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.stat span { font-size: 13px; color: var(--muted); font-weight: 700; }
.wordlist { display: flex; flex-wrap: wrap; gap: 8px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall linear forwards; }
.toast { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 16px; font-weight: 700; font-size: 14px; max-width: 90vw; z-index: 6; text-align: center; }
.modal-bg { position: fixed; inset: 0; background: rgba(5,6,24,.6); display: grid; place-items: end center; padding: 16px; z-index: 5; }
.modal { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 30px; padding: 22px; max-width: 460px; width: 100%; animation: rise .25s ease-out; }
.modal h3 { font-size: 20px; }
.modal { max-height: 88vh; overflow-y: auto; }
.goal { padding: 18px; }
.goal h3 { font-size: 19px; }
.goal-row { display: flex; align-items: center; gap: 16px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 16px; padding-top: 16px; border-top: 1.5px solid var(--line); }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 800; }
.day i { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-strong); display: grid; place-items: center; border: 2px solid var(--line); }
.day i svg { width: 18px; height: 18px; }
.day.on i { background: linear-gradient(135deg, var(--cta), #7be8ff); border-color: transparent; color: var(--cta-ink); }
.day.today i { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(124,92,255,.25); }
.day.today { color: var(--ink); }
.mist { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
.mist .btn { width: auto; align-self: flex-start; padding: 12px 20px; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; padding: 11px 6px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 800; color: var(--ink); }
.seg button.on { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); }
.set-h { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin-top: 4px; }
#app.withnav { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
.nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 24px); max-width: 436px; background: var(--nav-bg); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1.5px solid var(--line); border-radius: 34px; box-shadow: 0 14px 34px rgba(5, 6, 30, .35); padding: 8px; z-index: 4; }
.nav-in { display: flex; gap: 4px; }
.tab { flex: 1 1 0; min-width: 0; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 26px; background: none; color: var(--muted); font-weight: 800; font-size: 14px; transition: flex-grow .25s ease, background .2s, color .2s; }
.tab svg { width: 24px; height: 24px; flex: none; }
.tab .lb { display: none; white-space: nowrap; font-family: var(--font-display); font-weight: 600; font-size: 14px; }
.tab.on { flex-grow: 2.7; background: var(--violet); color: #fff; box-shadow: 0 4px 0 var(--violet-edge); }
.tab.on .lb { display: inline; }
.chap { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 24px; padding: 14px 16px; margin-bottom: 10px; }
.chap .no { width: 46px; height: 46px; border-radius: 15px; background: var(--surface-strong); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; flex: none; }
.chap .no svg { width: 22px; height: 22px; }
.chap b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.chap span.d { color: var(--muted); font-size: 14px; line-height: 1.3; display: block; }
.chap.locked { opacity: .8; }
.chap-open { margin: 14px 0 6px; }
.chap-open h2 { font-size: 22px; }
.rowitem { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1.5px solid var(--line); }
.rowitem:last-child { border-bottom: 0; }
.rowitem b { font-family: var(--font-display); font-weight: 600; font-size: 18px; display: block; }
.rowitem .muted { font-size: 14px; }
.soon { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.pill-tabs { display: flex; gap: 8px; margin: 4px 0 12px; }
.pill-tabs button { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 800; color: var(--ink); }
.pill-tabs button.on { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); }
.pstats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.avatar { display: flex; align-items: center; gap: 14px; }
.btn.small { padding: 12px 14px; font-size: 15px; }

@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 7px rgba(124,92,255,.28), 0 6px 0 var(--violet-edge); } 50% { box-shadow: 0 0 0 12px rgba(124,92,255,.12), 0 6px 0 var(--violet-edge); } }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.pop { animation: pop .3s cubic-bezier(.2,.9,.3,1.2); }
.bob { animation: bob 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="app"></div>

<script>

const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => dstr(new Date());
const dayDiff = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/864e5);
const shiftDays = (s,n) => { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return dstr(d); };

/* Дни подряд: если пропущен хотя бы один день, счётчик начинается заново (уроки и слова остаются) */
function checkStreak(){
  if(!S.lastDay || S.streak===0) return null;
  if(dayDiff(S.lastDay, todayStr())<=1) return null;
  const old=S.streak; S.streak=0; save(); return {old};
}
function markPractice(){
  checkStreak();
  const t=todayStr(); if(S.today.d!==t) S.today={d:t,n:0};
  S.today.n++;
  if(S.lastDay!==t){
    S.streak = (S.lastDay && S.streak>0 && dayDiff(S.lastDay,t)===1) ? S.streak+1 : 1;
    S.lastDay=t; S.days=[...S.days.filter(x=>x!==t),t].slice(-30);
  }
  save();
}
/* Ошибки: слово копит «вес», в режиме тренировки правильный ответ его снижает */
function grade(w,ok){
  if(!w) return;
  if(!ok){ S.weak[w]=Math.min(3,(S.weak[w]||0)+1); save(); }
  else if(S.lesson && S.lesson.mode==='mistakes' && S.weak[w]){ S.weak[w]--; if(S.weak[w]<=0) delete S.weak[w]; save(); }
}
function distract(w,n=2){
  const all=Object.keys(W).filter(x=>x!==w), known=all.filter(x=>S.words.includes(x));
  return [...shuffle(known),...shuffle(all.filter(x=>!known.includes(x)))].slice(0,n);
}

function speak(text){
  try {
    if(!('speechSynthesis' in window)) throw 0;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang='tr-TR'; u.rate=.85;
    const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith('tr'));
    if (v) u.voice=v; else toast('В этом браузере нет турецкого голоса. В продукте будет качественная озвучка.');
    speechSynthesis.speak(u);
  } catch(e){ toast('Озвучка недоступна в этом браузере. В продукте она будет.'); }
}
let toastT; function toast(msg){ clearTimeout(toastT); $('.toast')?.remove(); const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); toastT=setTimeout(()=>d.remove(),2800); }
function confetti(){
  const c=document.createElement('div'); c.className='confetti'; const cols=['#2ee6b8','#7c5cff','#ffc93c','#ff5d6c','#7be8ff'];
  for(let k=0;k<36;k++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'%'; p.style.background=cols[k%cols.length]; p.style.animationDuration=(1.6+Math.random()*1.6)+'s'; p.style.animationDelay=(Math.random()*.5)+'s'; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(()=>c.remove(),4000);
}

  ({learn:learnTab,practice:practiceTab,words:wordsTab,grammar:grammarTab,profile:profileTab})[S.tab]();
  app.insertAdjacentHTML('beforeend', `<nav class="nav" aria-label="Разделы"><div class="nav-in">${TABS.map(t=>`<button class="tab ${S.tab===t.id?'on':''}" data-tab="${t.id}" aria-label="${t.label}">${I[t.id]}<span class="lb">${t.label}</span></button>`).join('')}</div></nav>`);
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ if(S.tab!==b.dataset.tab){ S.tab=b.dataset.tab; render(); } });
  if(sres) setTimeout(()=>comeback(sres.old),350);
}

  app.innerHTML = `
  <div class="top">
    <span class="chip" title="Сколько дней подряд ты занимаешься">${I.flame} ${S.streak} ${S.streak===1?'день':'дн.'} подряд</span>
    <span class="chip" title="Очки опыта за занятия">${I.star} ${S.xp} XP</span>
  </div>
  <div class="hero pop">
    <svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="34" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" font-family="Rubik" font-weight="700" font-size="20" fill="#fff">${dn}/8</text></svg>
    <span class="tag">Глава 1</span>
    <h2>Первый контакт</h2>
    <p>Пройдено уроков: ${dn} из 8</p>
    <div class="mini"><button class="btn" id="go" ${nl?'':'disabled'}>${nl? (dn?'Продолжить':'Начать')+' · урок '+nl.n : 'Глава пройдена'}</button></div>
  </div>
  ${todayCard()}
  <div class="meters">

    <div class="card meter"><span class="tag">Понимаю речи</span><div class="big">~${cov}%</div><div class="bar"><i style="width:${Math.min(100,cov*2.2)}%"></i></div><span class="note">слов живой речи</span></div>
  </div>
  <div class="chap-open"><span class="tag">Глава 1 · ${dn} из 8 уроков</span><h2>Первый контакт</h2></div>
  <div class="path">
    ${LESSONS.map(l=>{
      const st = S.done[l.n] ? 'done' : (nl && nl.n===l.n ? 'current' : 'locked');
      return `<button class="node ${st}" data-n="${l.n}"><span class="circle">${S.done[l.n]?I.check:l.n}</span><span class="t"><b>${l.title}</b><span>${l.sub}</span></span></button>`;
    }).join('')}
  </div>
  <div style="margin-top:8px">
    ${CHAPTERS.slice(1).map(c=>`<button class="chap locked" data-c="${c.n}"><span class="no">${I.lock}</span><span><b>Глава ${c.n} · ${c.title}</b><span class="d">${c.goal}</span></span></button>`).join('')}

  });
  app.querySelectorAll('.chap').forEach(b=>b.onclick=()=>{ const c=CHAPTERS[+b.dataset.c-1]; modal(`Глава ${c.n}. ${c.title}`,`<p class="muted">В конце главы ты сможешь: ${c.goal.charAt(0).toLowerCase()+c.goal.slice(1)}</p><p class="note">Главы открываются по порядку. Позже появится короткая проверка, чтобы пропустить главу, которую ты уже знаешь.</p>`); });

  <div class="card">${t==='mine'?`<span class="tag">Слов выучено: ${S.words.length}</span>${list}`:`<span class="soon">скоро</span><h3 style="margin-top:10px">${soon[0]}</h3><p class="muted" style="margin-top:6px">${soon[1]}</p>`}</div>`;

    <div class="set-h">Напоминание</div>

    ${S.remind.on?`<div class="seg" id="rt">${['09:00','13:00','19:00','21:00'].map(t=>`<button data-t="${t}" class="${S.remind.t===t?'on':''}">${t}</button>`).join('')}</div>`:''}
    <p class="note">В приложении будет мягкое напоминание в выбранное время. В прототипе уведомлений нет.</p>
  </div>
  <div class="card stack" style="margin-top:12px"><span class="tag">Подписка</span><p class="muted">Здесь будет информация о подписке и бесплатном доступе.</p><span class="soon" style="align-self:flex-start">скоро</span></div>
  <div class="card stack" style="margin-top:12px"><div class="set-h">Данные прототипа</div>

function todayCard(){
  const t=todayStr(), cnt=todayCount(), done=cnt>=S.goal;
  const R=26, C=2*Math.PI*R, off=C*(1-Math.min(1,cnt/S.goal));
  const days=[6,5,4,3,2,1,0].map(k=>{ const d=shiftDays(t,-k); const wd=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(d+'T12:00:00').getDay()]; const on=S.days.includes(d); return `<div class="day ${on?'on':''} ${k===0?'today':''}"><i>${on?I.check:''}</i>${wd}</div>`; }).join('');
  return `<div class="card goal">
    <div class="goal-row">
      <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--surface-strong)" stroke-width="8"/><circle cx="32" cy="32" r="${R}" fill="none" stroke="${done?'var(--cta)':'var(--violet)'}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 32 32)"/><text x="32" y="38" text-anchor="middle" font-family="Rubik" font-weight="700" font-size="17" fill="var(--ink)">${cnt}/${S.goal}</text></svg>
      <div><h3>Цель на день</h3><p class="muted">${done?'Выполнена. Возвращайся завтра!':'Пройди урок или повторение'}</p></div>
    </div>
    <div class="week">${days}</div>
  </div>`;
}
function mistakesCard(){
  const wk=Object.keys(S.weak);
  return `<div class="card mist"><div><span class="tag">Мои ошибки</span><h3 style="font-size:19px;margin-top:2px">${wk.length?`${wk.length} ${wk.length===1?'слово':'слов'} для тренировки`:'Пока без ошибок'}</h3></div>
    ${wk.length?`<div class="wordlist">${wk.map(w=>`<span class="chip">${W[w].tr}</span>`).join('')}</div><button class="btn violet" id="mis">Тренировать ошибки</button>`:`<p class="note">Слова, в которых ты ошибся, появятся здесь. Правильные ответы убирают их из списка.</p>`}</div>`;
}
function startMistakes(){ const ids=Object.keys(S.weak).slice(0,6); if(!ids.length) return toast('Ошибок нет — отлично!'); beginQueue({n:0,title:'Мои ошибки',mode:'mistakes'}, quizFor(ids)); }
function comeback(old){
  modal('С возвращением!', `<div class="row">${mascot('happy',72)}<p class="muted">Ты занимался ${old} дн. подряд. Счётчик начался заново, но уроки и слова остались. Начнём с лёгкой разминки на пару минут.</p></div><button class="btn" id="cb">Разминка</button>`, true);
  $('#cb').onclick=()=>{ document.querySelector('.modal-bg')?.remove(); if(S.words.length) beginQueue({n:0,title:'Повторение'}, quizFor(shuffle(S.words).slice(0,4))); else startLesson(nextLesson()); };
}

function startLesson(l){ if(!l) return; if(!l.playable) return modal(`Урок ${l.n}. ${l.title}`,`<p class="muted">${l.goal}</p>`); beginQueue(l, STEPS[l.n].map(x=>({...x}))); }
function beginQueue(l,q){ S.lesson=l; S.queue=q; S.i=0; S.total=q.filter(x=>x.t!=='label').length; S.mistakes=0; S.answered=false; S.screen='lesson'; S.seen=0; render(); }

function shell(inner, foot){
  const prog = S.total ? Math.min(100, S.seen/S.total*100) : 0;
  app.innerHTML = `
  <div class="lhead"><button class="x" id="quit" aria-label="Закрыть урок">${I.close}</button><div class="bar"><i style="width:${prog}%"></i></div></div>
  <div class="stage pop">${inner}</div>
  <div id="foot">${foot||''}</div>`;
  $('#quit').onclick=()=>{ S.screen='home'; render(); };
}
const next = ()=>{ S.i++; S.answered=false; if(S.i>=S.queue.length){ S.screen='done'; } render(); };
function advanceFoot(label='Дальше'){ $('#foot').innerHTML=`<div class="foot"><button class="btn" id="nx">${label}</button></div>`; $('#nx').onclick=next; }
const PRAISE = ['Верно!','Отлично!','Так держать!','Супер!'];
function sheet(ok,detail){
  $('#foot').innerHTML = `<div class="sheet ${ok?'ok':'no'}"><div class="msg">${mascot(ok?'happy':'sad',54)}<div><b>${ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'Почти!'}</b>${detail?`<span>${detail}</span>`:''}</div></div><button class="btn ${ok?'':'violet'}" id="nx">Дальше</button></div>`;
  $('#nx').onclick=next;
}
function wrong(st){ S.mistakes++; if(!st._again){ S.queue.push({...st,_again:true}); S.total++; } }

function step(){
  const st = S.queue[S.i];
  if (!st) { S.screen='done'; return render(); }
  S.seen = S.queue.slice(0,S.i).filter(x=>x.t!=='label').length;
  ({label:sLabel,teach:sTeach,choose:sChoose,pic:sPic,pairs:sPairs,build:sBuild,dialog:sDialog,insight:sInsight,scene:sScene})[st.t](st);
}

function sLabel(st){
  const [a,b]=st.text.split(':');
  shell(`<div style="margin:auto 0;align-items:center;text-align:center" class="stack"><span class="bob">${mascot('happy',110)}</span><span class="tag">${a}</span><h2>${b?b.trim():''}</h2></div>`, `<div class="foot"><button class="btn" id="nx">Поехали</button></div>`);
  $('#nx').onclick=next;
}

function sTeach(st){
  const w=W[st.w];
  shell(`<span class="tag">Новое слово</span>
    <div class="card teach">
      <div class="art">${w.icon?`<div class="pic">${I[w.icon]}</div>`:''}
        <div class="bigword">${w.tr}</div><div class="tx">[${w.tx}]</div></div>
      <div class="body"><h3>${w.ru}</h3><button class="speak" id="sp" aria-label="Послушать">${I.play}</button></div>
    </div>
    <p class="note">Нажми на динамик и повтори вслух.</p>`,
    `<div class="foot"><button class="btn" id="nx">Запомнил</button></div>`);
  $('#sp').onclick=()=>speak(w.tr); $('#nx').onclick=()=>{ next(); };
  setTimeout(()=>speak(w.tr),350);
}

function sChoose(st){
  const w=W[st.w], opts=shuffle(st.opts);
  const head = st.mode==='listen'
    ? `<span class="lbl">Что ты услышал?</span><div class="row"><button class="speak" id="sp" aria-label="Послушать">${I.play}</button><span class="muted">нажми и выбери перевод</span></div>`
    : `<span class="lbl">Выбери перевод</span><div class="bigword">${w.tr}</div>`;
  shell(`${head}<div class="opts">${opts.map(o=>`<button class="opt" data-w="${o}">${W[o].ru}</button>`).join('')}</div>`);
  if(st.mode==='listen'){ $('#sp').onclick=()=>speak(w.tr); setTimeout(()=>speak(w.tr),300); }
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.answered) return; S.answered=true;
    const ok=b.dataset.w===st.w; b.classList.add(ok?'ok':'no'); grade(st.w,ok);
    if(!ok){ app.querySelector(`[data-w="${st.w}"]`).classList.add('ok'); wrong(st); }
    sheet(ok, ok?'':`Правильно: ${w.tr} — ${w.ru}`);
  });
}

function sPic(st){
  const w=W[st.w];
  shell(`<span class="lbl">Нажми на то, что услышишь</span>
    <div class="row"><button class="speak" id="sp" aria-label="Послушать">${I.play}</button><span class="muted">Bu …</span></div>
    <div class="opts two">${shuffle(st.opts).map(o=>`<button class="opt" data-w="${o}" aria-label="${W[o].ru}">${I[W[o].icon]}</button>`).join('')}</div>`);
  $('#sp').onclick=()=>speak('Bu '+w.tr); setTimeout(()=>speak('Bu '+w.tr),300);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.answered) return; S.answered=true;
    const ok=b.dataset.w===st.w; b.classList.add(ok?'ok':'no'); grade(st.w,ok);
    if(!ok){ app.querySelector(`[data-w="${st.w}"]`).classList.add('ok'); wrong(st); }
    sheet(ok, `Bu ${w.tr} — это ${w.ru}`);
  });
}

function sPairs(st){
  const L=shuffle(st.ws), R=shuffle(st.ws); let selL=null, left=st.ws.length;
  shell(`<span class="lbl">Найди пары</span>
    <div class="pairs"><div class="opts" id="cl">${L.map(w=>`<button class="opt" data-w="${w}">${W[w].tr}</button>`).join('')}</div>
    <div class="opts" id="cr">${R.map(w=>`<button class="opt" data-w="${w}">${W[w].ru}</button>`).join('')}</div></div>`);
  const cl=$('#cl'), cr=$('#cr');
  cl.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ cl.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selL=b; speak(W[b.dataset.w].tr); });
  cr.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(!selL) return;
    if(selL.dataset.w===b.dataset.w){ selL.classList.add('ok'); b.classList.add('ok'); const a=selL; setTimeout(()=>{a.classList.add('gone'); b.classList.add('gone');},300); selL=null; if(--left===0) setTimeout(()=>advanceFoot('Дальше'),350); }
    else { b.classList.add('no'); S.mistakes++; grade(selL.dataset.w,false); setTimeout(()=>b.classList.remove('no'),400); }
  });
}

function sBuild(st){
  const tiles=shuffle([...st.tr,...(st.extra||[])]), ans=[];
  shell(`<span class="lbl">Собери по-турецки</span><h3 class="muted" style="font-family:var(--font-body);font-weight:700">${st.ru}</h3>
    <div class="line" id="ln"></div><div class="tiles" id="tl"></div>`, `<div class="foot"><button class="btn" id="ck" disabled>Проверить</button></div>`);
  const ln=$('#ln'), tl=$('#tl'), ck=$('#ck');
  const draw=()=>{ ln.innerHTML=ans.map((w,i)=>`<button class="tile" data-a="${i}">${w}</button>`).join(''); tl.innerHTML=tiles.map((w,i)=>`<button class="tile" data-t="${i}">${w}</button>`).join(''); ck.disabled=!ans.length;
    ln.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ if(S.answered) return; tiles.push(ans.splice(+b.dataset.a,1)[0]); draw(); });
    tl.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ if(S.answered) return; const w=tiles.splice(+b.dataset.t,1)[0]; ans.push(w); draw(); speak(w); }); };
  draw();
  ck.onclick=()=>{ if(S.answered) return; S.answered=true; const ok=ans.join(' ')===st.tr.join(' '); if(!ok) wrong(st); speak(st.tr.join(' ')); sheet(ok, ok?`${st.tr.join(' ')}`:`Правильно: ${st.tr.join(' ')}`); };
}

function sDialog(st){
  const bl=st.lines.find(l=>l.blank);
  shell(`<span class="lbl">Закончи диалог</span>
    <div class="stack">${st.lines.map(l=>`<div class="bubble ${l.who==='b'?'me':''}">${l.tr.replace('___','<span class="blank" id="bl">&nbsp;</span>')}<small>${l.ru}</small></div>`).join('')}</div>
    <div class="opts" style="margin-top:8px">${shuffle(st.opts).map(o=>`<button class="opt" data-w="${o}">${W[o].tr}</button>`).join('')}</div>`);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.answered) return; S.answered=true;
    const ok=b.dataset.w===bl.blank; b.classList.add(ok?'ok':'no'); grade(bl.blank,ok);
    $('#bl').textContent=W[bl.blank].tr; if(!ok){ app.querySelector(`[data-w="${bl.blank}"]`).classList.add('ok'); wrong(st); }
    speak(bl.tr.replace('___',W[bl.blank].tr));
    sheet(ok, ok?'':`Правильно: ${W[bl.blank].tr}`);
  });
}

function sInsight(){
  shell(`<span class="tag">Заметил?</span>
    <div class="card insight">
      <h3>Слова «есть» нет</h3>
      <div class="eq"><div>Bu <mark>ev</mark>.<small>Это дом — только «это» + «дом»</small></div>
      <div>Bu <mark>araba</mark>.<small>Это машина</small></div></div>
      <p>Назвать предмет можно двумя словами. Связка между ними не нужна.</p>
      <details><summary>Подробнее</summary><p style="margin-top:8px" class="muted">В турецком в 3-м лице «есть/является» чаще всего не произносят. Дальше мы увидим то же самое в предложениях вроде «Ev büyük» — «Дом большой».</p></details>
    </div>`, `<div class="foot"><button class="btn" id="nx">Понятно</button></div>`);
  $('#nx').onclick=next;
}

function sScene(st){
  shell(`<span class="lbl">Сцена</span>
    <div class="scene">${SCENE_SVG}<div class="cap">${st.tr}<small>${st.ru}</small></div></div>
    <button class="btn ghost" id="pl">Послушать реплику</button>
    <p class="note">Макет. В продукте здесь будет короткая анимированная сцена с живой репликой.</p>`, `<div class="foot"><button class="btn" id="nx">Закончить урок</button></div>`);
  $('#pl').onclick=()=>speak(st.tr.replace(' — ',' '));
  $('#nx').onclick=next;
}

function finish(){
  const l=S.lesson, gained = l.n ? 40-Math.min(S.mistakes*3,20) : 10;
  if(l.n){ S.done[l.n]=true; (NEW_WORDS[l.n]||[]).forEach(w=>{ if(!S.words.includes(w)) S.words.push(w); }); }
  S.xp+=gained; markPractice(); save();
  const cnt = todayCount();
  const nw = l.n?NEW_WORDS[l.n]:[];
  const acc = Math.max(40, Math.round(100 - S.mistakes/Math.max(S.total,1)*100));
  const before=(coverage()-(l.n?COVER_GAIN[l.n]:0));
  app.innerHTML = `
  <div class="burst stack pop" style="margin-top:3vh"><span class="bob">${mascot('happy',120)}</span>
    <span class="tag">${l.n?`Урок ${l.n} пройден`:(l.mode==='mistakes'?'Тренировка ошибок завершена':'Повторение завершено')}</span>
    <h1 class="hero-title">${l.n?'Отличная работа!':'Так держать!'}</h1></div>
  <div class="stats" style="margin-top:16px">
    <div class="card stat"><b>+${gained}</b><span>XP</span></div>
    <div class="card stat"><b>${acc}%</b><span>точность</span></div>
    <div class="card stat"><b>${S.words.length}</b><span>слов знаю</span></div>
  </div>
  <div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><div class="row">${I.flame}<b style="font-family:var(--font-display);font-size:18px">Дней подряд: ${S.streak}</b></div><span class="muted">Цель дня: ${Math.min(cnt,S.goal)}/${S.goal}</span></div>${cnt>=S.goal?'<p class="note" style="margin-top:6px">Цель дня выполнена!</p>':''}${l.mode==='mistakes'?`<p class="note" style="margin-top:6px">Осталось слов для тренировки: ${Object.keys(S.weak).length}</p>`:''}</div>
  ${l.n?`<div class="card stack" style="margin-top:12px"><span class="tag">Понимание речи</span><div class="row"><b style="font-family:var(--font-display);font-size:26px">~${coverage()}%</b><span class="muted">слов типичного диалога</span></div><div class="bar"><i id="cv" style="width:${Math.min(100,before*2.2)}%"></i></div></div>
  <div class="card stack" style="margin-top:12px"><span class="tag">Новые слова</span><div class="wordlist">${nw.map(w=>`<span class="chip">${W[w].tr}</span>`).join('')}</div><p class="note">Эти слова вернутся в следующих уроках и в автоповторении.</p></div>`:''}
  <div class="sticky"><button class="btn" id="hm">${l.n && nextLesson() && nextLesson().playable ? `Дальше · урок ${nextLesson().n}` : 'На главную'}</button></div>`;
  setTimeout(()=>{ const c=$('#cv'); if(c) c.style.width=Math.min(100,coverage()*2.2)+'%'; },150);
  confetti();
  $('#hm').onclick=()=>{ const nl=nextLesson(); if(l.n && nl && nl.playable) startLesson(nl); else { S.screen='home'; render(); } };
}

function modal(title,html,stackBtns){
  document.querySelector('.modal-bg')?.remove();
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal stack"><h3>${title}</h3>${html}<button class="btn ${stackBtns?'':'violet'}" id="mc" ${stackBtns?'style="margin-top:4px"':''}>${stackBtns?'Закрыть':'Понятно'}</button></div>`;
  document.body.appendChild(bg); bg.onclick=e=>{ if(e.target===bg) bg.remove(); }; $('#mc',bg).onclick=()=>bg.remove();
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
render();
</script>
